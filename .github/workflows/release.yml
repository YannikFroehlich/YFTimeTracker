name: Release YFTimeTracker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      version:
        description: "Zu veroeffentlichende Version ohne fuehrendes v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    concurrency:
      group: ${{ inputs.version != '' && format('yftimetracker-release-called-{0}', github.run_id) || 'yftimetracker-version-release' }}
      cancel-in-progress: false

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: .NET einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Version und Quellstand pruefen
        id: release
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Ungueltige Release-Version: $version"
          }

          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expectedSha = "${{ github.sha }}".Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$' -or $sha -ne $expectedSha) {
            throw "Checkout $sha entspricht nicht $expectedSha"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Release-Notes aus CHANGELOG.md ermitteln
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $lines = Get-Content -LiteralPath "CHANGELOG.md" -Encoding utf8
          $notesLines = New-Object System.Collections.Generic.List[string]
          $capturing = $false
          foreach ($line in $lines) {
            if ($line -match '^##\s+') {
              if ($capturing) {
                break
              }
              if ($line -match "^##\s+$([regex]::Escape($version))(\s|$)") {
                $capturing = $true
              }
              continue
            }
            if ($capturing) {
              $notesLines.Add($line)
            }
          }

          $notes = ($notesLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "_Kein Changelog-Eintrag fuer diese Version. Siehe [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)._"
          }

          $notesPath = Join-Path $PWD "artifacts/release-notes.md"
          New-Item -ItemType Directory -Force -Path (Split-Path $notesPath) | Out-Null
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($notesPath, $notes, $utf8WithoutBom)

          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: App testen und portables Release bauen
        shell: pwsh
        run: >-
          .\scripts\New-Release.ps1
          -Version "${{ steps.release.outputs.version }}"

      - name: Release-Manifest erstellen
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schemaVersion = 1
            version = "${{ steps.release.outputs.version }}"
            repository = "${{ github.repository }}"
            sha = "${{ steps.release.outputs.sha }}"
            runtime = "win-x64"
          } | ConvertTo-Json

          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          $manifestPath = Join-Path $PWD "artifacts/release/release-manifest.json"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $manifest + [Environment]::NewLine,
            $utf8WithoutBom)

      - name: Velopack installieren
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Vorherigen Release fuer Delta-Updates laden
        continue-on-error: true
        shell: pwsh
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --outputDir artifacts/velopack

      - name: Setup und MSI erstellen
        shell: pwsh
        run: >-
          vpk pack
          --packId YFTimeTracker
          --packVersion "${{ steps.release.outputs.version }}"
          --packDir "artifacts/release/YFTimeTracker-v${{ steps.release.outputs.version }}-win-x64"
          --mainExe YFTimeTracker.App.exe
          --packTitle YFTimeTracker
          --packAuthors YannikFroehlich
          --icon YFTimeTracker.App/Assets/YFTimeTracker.ico
          --outputDir artifacts/velopack
          --msi
          --instLocation Either
          --shortcuts StartMenuRoot

      - name: Velopack-Paket pruefen
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $outputDirectory = Join-Path $PWD "artifacts/velopack"
          $packagePath = Join-Path $outputDirectory "YFTimeTracker-$version-full.nupkg"
          $requiredArtifacts = @(
            $packagePath,
            (Join-Path $outputDirectory "YFTimeTracker-win-Setup.exe"),
            (Join-Path $outputDirectory "YFTimeTracker-win.msi"),
            (Join-Path $outputDirectory "releases.win.json")
          )
          $missingArtifacts = @(
            $requiredArtifacts | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          )
          if ($missingArtifacts.Count -gt 0) {
            throw "Velopack-Ausgabe ist unvollstaendig: $($missingArtifacts -join ', ')"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entryNames = @($archive.Entries.FullName)
            $requiredEntries = @(
              "lib/app/YFTimeTracker.App.exe",
              "lib/app/YFTimeTracker.App.dll",
              "lib/app/YFTimeTracker.App.pri",
              "lib/app/Assets/YFTimeTrackerLogo.png",
              "lib/app/Assets/YFTimeTracker.ico"
            )
            $missingEntries = @(
              $requiredEntries | Where-Object { $entryNames -notcontains $_ }
            )
            if ($missingEntries.Count -gt 0) {
              throw "Velopack-Paket ist unvollstaendig: $($missingEntries -join ', ')"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: GitHub Release veroeffentlichen
        shell: pwsh
        run: >-
          vpk upload github
          --outputDir artifacts/velopack
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --releaseName "YFTimeTracker v${{ steps.release.outputs.version }}"
          --tag "v${{ steps.release.outputs.version }}"
          --targetCommitish "${{ steps.release.outputs.sha }}"

      - name: Release-Notes veroeffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "v${{ steps.release.outputs.version }}"
          --notes-file "${{ steps.changelog.outputs.path }}"
          --repo "${{ github.repository }}"

      - name: Portables ZIP und Manifest hochladen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "v${{ steps.release.outputs.version }}"
          "artifacts/release/YFTimeTracker-v${{ steps.release.outputs.version }}-win-x64.zip"
          "artifacts/release/YFTimeTracker-v${{ steps.release.outputs.version }}-win-x64.zip.sha256"
          "artifacts/release/release-manifest.json"
          --repo "${{ github.repository }}"
          --clobber
