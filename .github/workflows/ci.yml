name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: yftimetracker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build und Tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: .NET einrichten
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore YFTimeTracker.slnx --configfile NuGet.config

      - name: Release-Konfiguration bauen
        run: dotnet build YFTimeTracker.slnx --configuration Release --no-restore

      - name: Tests ausführen
        run: dotnet test YFTimeTracker.slnx --configuration Release --no-build --no-restore
